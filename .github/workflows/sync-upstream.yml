name: Sync upstream repository

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          #token: ${{ secrets.PUSH_TOKEN }}

      - name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/MHSanaei/3x-ui.git
          git fetch upstream main
          git merge --no-edit -X theirs upstream/main

      - name: Localize scripts and reapply fork customizations
        run: |
          python3 tools/localize-shell-scripts.py . .
          python3 tools/apply-local-overrides.py

      - name: Commit and push updated fork
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream or customization changes to publish."
            exit 0
          fi
          git add -A
          git commit -m "Sync upstream main with Chinese customizations"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build and publish this fork's rolling release
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ PUSH_TOKEN }}
          #GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main
