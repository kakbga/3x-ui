
name: Sync upstream repository

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1. 获取自己的 Fork 仓库
      - name: Check out fork
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PUSH_TOKEN }}

      # 2. 合并官方上游 main 分支
      - name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/MHSanaei/3x-ui.git
          git fetch upstream main

          git merge --no-edit -X theirs upstream/main

      # 3. 本地化脚本并重新应用自己的定制
      - name: Localize scripts and reapply fork customizations
        run: |
          python3 tools/localize-shell-scripts.py . .
          python3 tools/apply-local-overrides.py

      # 4. 检查变化、提交并推送到自己的 main
      - name: Commit and push updated fork
        id: commit
        run: |
          git add -A

          # 如果本地化或自定义脚本产生了文件修改，先提交
          if ! git diff --cached --quiet; then
            git commit -m "Sync upstream main with Chinese customizations"
          fi

          # 检查本地是否有尚未推送到 origin/main 的提交
          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            git push origin HEAD:main

            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Successfully pushed updates to main."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream or customization changes to publish."
          fi

      # 5. 有新提交时，触发自己 Fork 的 Release
      - name: Build and publish this fork's rolling release
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          gh workflow run release.yml --ref main --repo kakbga/3x-ui
